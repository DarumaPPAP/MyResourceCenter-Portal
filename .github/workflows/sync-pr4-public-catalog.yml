name: Sync PR4 Public Catalog Snapshot

on:
  push:
    branches: [feature/portal-detail-collection-ux]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: feature/portal-detail-collection-ux
      - name: Download validated projection artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://sdmntprwestus2.oaiusercontent.com/files/00000000-00f4-81f8-978e-2183821d3552/raw?se=2026-08-10T15%3A07%3A43Z&sp=r&sv=2026-02-06&sr=b&scid=f34af7ed-d3a5-5421-a2f2-e0036db9bdb4&skoid=b1bca990-dcac-4c31-8ca1-ac563cf24c54&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-10T00%3A06%3A42Z&ske=2026-08-11T00%3A06%3A42Z&sks=b&skv=2026-02-06&sig=1S/lD/G7wEqL1bvfElcXr8Dy8tK0yzz4/oEZpejmlOc%3D' -o /tmp/public-catalog.zip
          rm -rf /tmp/public-catalog
          mkdir -p /tmp/public-catalog
          unzip -q /tmp/public-catalog.zip -d /tmp/public-catalog
          cp /tmp/public-catalog/*.json catalog/
          rm -f catalog/websites-data.json
      - name: Commit snapshot when changed
        shell: bash
        run: |
          set -euo pipefail
          git add catalog
          if git diff --cached --quiet; then
            echo 'Catalog already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: sync validated PR4 public catalog'
          git push origin HEAD:feature/portal-detail-collection-ux

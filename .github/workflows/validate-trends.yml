name: Validate Trend Radar

on:
  pull_request:
    paths:
      - 'trend.html'
      - 'assets/trend.css'
      - 'assets/trend.js'
      - 'assets/portal.js'
      - 'data/trends.json'
      - 'data/trend-candidates.json'
      - 'data/trend-sources.json'
      - 'tools/validate_trends.py'
      - 'tools/update_trends.py'
      - 'tools/harvest_trend_sources.py'
      - 'tools/refine_trend_candidates.py'
      - 'tools/validate_trend_candidates.py'
      - '.github/workflows/validate-trends.yml'
      - '.github/workflows/harvest-trend-candidates.yml'
  push:
    branches: [main]
    paths:
      - 'trend.html'
      - 'assets/trend.css'
      - 'assets/trend.js'
      - 'assets/portal.js'
      - 'data/trends.json'
      - 'data/trend-candidates.json'
      - 'data/trend-sources.json'
      - 'tools/validate_trends.py'
      - 'tools/update_trends.py'
      - 'tools/harvest_trend_sources.py'
      - 'tools/refine_trend_candidates.py'
      - 'tools/validate_trend_candidates.py'
      - '.github/workflows/validate-trends.yml'
      - '.github/workflows/harvest-trend-candidates.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compile Trend tools
        run: |
          python3 -m py_compile \
            tools/validate_trends.py \
            tools/update_trends.py \
            tools/harvest_trend_sources.py \
            tools/refine_trend_candidates.py \
            tools/validate_trend_candidates.py

      - name: Validate Trend datasets
        run: |
          python3 tools/validate_trends.py
          python3 tools/validate_trend_candidates.py

      - name: Smoke test Harvest parser and domain filter
        shell: bash
        run: |
          python3 - <<'PY'
          from tools.harvest_trend_sources import parse_datetime, parse_feed
          from tools.refine_trend_candidates import remove_ambiguous_matches

          cutoff = parse_datetime('2026-08-03T00:00:00+09:00')
          fixture = b'''<?xml version="1.0"?>
          <rss><channel><item>
            <title>Unity Shader smoke test</title>
            <link>https://example.com/zenn-smoke</link>
            <pubDate>Mon, 10 Aug 2026 01:00:00 GMT</pubDate>
            <description>URP RenderGraph</description>
          </item></channel></rss>'''
          items = parse_feed(fixture, 'Zenn', {'Unity'}, 'zenn-topic-feed:unity', cutoff)
          assert len(items) == 1
          assert items[0]['matchedKeywords'] == ['Unity']

          false_hit = {
              'title': 'Databricks Unity Catalog update',
              'snippet': 'Unity Catalog governance',
              'tags': [],
              'matchedKeywords': ['Unity'],
          }
          assert remove_ambiguous_matches(false_hit) is None

          real_hit = {
              'title': 'Unity 6 URP RenderGraph update',
              'snippet': 'Unity Editor rendering',
              'tags': ['Unity'],
              'matchedKeywords': ['Unity'],
          }
          assert remove_ambiguous_matches(real_hit) is not None
          PY

      - name: Smoke test Trend updater
        shell: bash
        run: |
          cat > /tmp/trend-items.json <<'JSON'
          {
            "items": [
              {
                "title": "Updater smoke test",
                "url": "https://example.com/trend-smoke-test",
                "source": "CI Fixture",
                "publishedAt": "2099-01-03T09:00:00+09:00",
                "category": "Tools",
                "type": "TOOL",
                "summary": "Trend updaterの保持・検証経路だけを確認するCI用データ。",
                "tags": ["CI"],
                "score": 80
              }
            ]
          }
          JSON
          python3 tools/update_trends.py --input /tmp/trend-items.json --date 2099-01-03
          python3 tools/validate_trends.py

      - name: Smoke test 100-item daily limit
        shell: bash
        run: |
          python3 - <<'PY'
          import json

          items = []
          for index in range(100):
              items.append({
                  'title': f'100 item limit smoke test {index + 1}',
                  'url': f'https://example.com/trend-limit-{index + 1}',
                  'source': 'CI Fixture',
                  'publishedAt': '2099-01-04T09:00:00+09:00',
                  'category': 'Tools',
                  'type': 'TOOL',
                  'summary': 'Trend Radarの1日100件上限を実際に通すCI用データ。',
                  'tags': ['CI'],
                  'score': 100 - index,
              })

          with open('/tmp/trend-items-100.json', 'w', encoding='utf-8') as handle:
              json.dump({'items': items}, handle, ensure_ascii=False)
          PY
          python3 tools/update_trends.py --input /tmp/trend-items-100.json --date 2099-01-04
          python3 tools/validate_trends.py
          python3 - <<'PY'
          import json

          with open('data/trends.json', encoding='utf-8') as handle:
              data = json.load(handle)
          assert len(data['days'][0]['items']) == 100
          assert data['days'][0]['items'][-1]['id'].endswith('-100')
          PY

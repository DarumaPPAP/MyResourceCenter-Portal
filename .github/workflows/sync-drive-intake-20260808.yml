name: Sync Drive Intake 20260808

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.ref == 'sync/drive-intake-20260808'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Sync portal catalog and stats
        run: python tools/sync_drive_intake_20260808.py
      - name: Validate public document catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          docs=json.loads(Path('catalog/documents.json').read_text(encoding='utf-8'))
          if len(docs)!=28: raise SystemExit(f'expected 28 docs, got {len(docs)}')
          text=Path('index.html').read_text(encoding='utf-8')
          for value in ['>90<','>28<','>87<']:
              if value not in text: raise SystemExit(f'missing stat {value}')
          print('Portal metadata validated.')
          PY
      - name: Commit portal sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html catalog/documents.json
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'Sync 9 new knowledge documents to public portal'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

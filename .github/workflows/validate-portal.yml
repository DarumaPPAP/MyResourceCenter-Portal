name: Validate Portal

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Validate Portal public boundary and UX data
        run: python tools/validate_portal.py
      - name: Validate Browser Viewer routing and responsive UI
        run: python tools/validate_browser_viewer.py
      - name: Validate Trend Radar dataset
        run: python tools/validate_trends.py
      - name: Validate Trend candidates
        run: python tools/validate_trend_candidates.py
      - name: Test filter state and Human Portal presentation
        run: |
          node tools/test_filter_state.cjs
          node tools/test_human_portal.cjs

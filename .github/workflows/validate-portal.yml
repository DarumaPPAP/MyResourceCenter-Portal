name: Validate Portal

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install pinned thumbnail verification codec
        run: python -m pip install --requirement tools/thumbnail-requirements.txt
      - name: Regression test public catalog sync
        run: python tools/test_sync_public_projection.py
      - name: Validate Portal public boundary and UX data
        run: python tools/validate_portal.py
      - name: Validate Browser Viewer routing and responsive UI
        run: python tools/validate_browser_viewer.py
      - name: Validate Trend Radar dataset
        run: python tools/validate_trends.py
      - name: Validate Trend candidates
        run: python tools/validate_trend_candidates.py
      - name: Test filter state and Human Portal presentation
        run: |
          node tools/test_repositories.cjs
          node tools/test_filter_state.cjs
          node tools/test_human_portal.cjs
          node tools/test_home.cjs
          node tools/test_deploy_workflow.cjs
          node tools/test_portal_delivery.cjs

  deploy-pages:
    needs: validate
    if: >-
      needs.validate.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Stage versioned public site
        run: node tools/build_portal.cjs "${RUNNER_TEMP}/portal-pages"

      - name: Upload static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/portal-pages
          # Keep failed-job reruns from producing duplicate artifact names.
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Wait for Pages artifact to become visible
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # Artifact metadata may not be immediately visible after upload.
          for attempt in $(seq 1 15); do
            if artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --paginate --jq '.artifacts[].name')"; then
              count="$(printf '%s\n' "$artifacts" | awk -v target="$ARTIFACT_NAME" '$0 == target { n++ } END { print n+0 }')"
              if (( count == 1 )); then
                echo "Artifact ${ARTIFACT_NAME} visible (attempt ${attempt})."
                # Allow the Pages deployment artifact backend time to converge.
                sleep 8
                exit 0
              fi
              if (( count > 1 )); then
                echo "::error::Multiple artifacts named ${ARTIFACT_NAME} (count=${count})"
                exit 1
              fi
            fi
            if (( attempt < 15 )); then sleep 5; fi
          done
          echo "::error::Artifact ${ARTIFACT_NAME} was not visible after bounded retries"
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

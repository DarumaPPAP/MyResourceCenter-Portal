name: Validate Portal

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install pinned thumbnail verification codec
        run: python -m pip install --requirement tools/thumbnail-requirements.txt
      - name: Validate Portal public boundary and UX data
        run: python tools/validate_portal.py
      - name: Validate Browser Viewer routing and responsive UI
        run: python tools/validate_browser_viewer.py
      - name: Validate Trend Radar dataset
        run: python tools/validate_trends.py
      - name: Validate Trend candidates
        run: python tools/validate_trend_candidates.py
      - name: Test filter state and Human Portal presentation
        run: |
          node tools/test_repositories.cjs
          node tools/test_filter_state.cjs
          node tools/test_human_portal.cjs
          node tools/test_home.cjs
          node tools/test_deploy_workflow.cjs

  deploy-pages:
    needs: validate
    if: >-
      needs.validate.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

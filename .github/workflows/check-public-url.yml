name: Check public Portal URLs

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  check:
    if: github.event.issue.title == 'Check Portal URLs'
    runs-on: ubuntu-latest
    steps:
      - name: Verify all public pages
        env:
          BASE_URL: https://darumappap.github.io/MyResourceCenter-Portal/
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          declare -a paths=('' 'websites.html' 'documents.html')
          declare -a expects=('MyResourceCenter' '登録Webサイト一覧' '変換済みMarkdown一覧')
          report=''
          failed=0
          for idx in 0 1 2; do
            url="${BASE_URL}${paths[$idx]}"
            expected="${expects[$idx]}"
            code=000
            ok=0
            for i in {1..6}; do
              code="$(curl -L -sS -o /tmp/page.html -w '%{http_code}' --max-time 20 "$url" || true)"
              if [[ "$code" == '200' ]] && grep -q "$expected" /tmp/page.html; then
                ok=1
                break
              fi
              sleep 3
            done
            if [[ "$ok" == '1' ]]; then
              report+="✅ ${paths[$idx]:-index.html}: HTTP $code; expected text found%0A"
            else
              report+="❌ ${paths[$idx]:-index.html}: HTTP $code; expected text missing%0A"
              failed=1
            fi
          done
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Portal live verification:%0A$report%0A$BASE_URL"
          exit "$failed"

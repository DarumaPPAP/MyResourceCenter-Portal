name: One-shot Validated Website Icon Sync

on:
  push:
    branches:
      - sync/verified-website-icons-20261110
    paths:
      - .github/workflows/one-shot-validated-icon-sync.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'DarumaPPAP/MyResourceCenter-Portal'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Portal sync branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: sync/verified-website-icons-20261110
          persist-credentials: true
      - name: Checkout validated Source commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: DarumaPPAP/MyResourceCenter
          ref: 572889177ffd6ab3101f2a127f48c16b2a1c3348
          path: source
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install pinned image verification dependencies
        run: python -m pip install --requirement tools/thumbnail-requirements.txt
      - name: Rebuild and validate Source public-only projection
        shell: bash
        run: |
          set -euo pipefail
          python source/tools/build_public_projection.py --output "$RUNNER_TEMP/public-catalog"
          python source/tools/validate_safe_pipeline.py
          python - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads((Path(os.environ["RUNNER_TEMP"]) / "public-catalog" / "manifest.json").read_text())
          expected = "572889177ffd6ab3101f2a127f48c16b2a1c3348"
          if manifest["sourceCommit"] != expected:
              raise SystemExit(f"Source commit mismatch: {manifest['sourceCommit']} != {expected}")
          print("Verified public projection source:", expected)
          PY
      - name: Import via existing Portal allowlisted projection sync
        shell: bash
        run: |
          set -euo pipefail
          python tools/sync_public_projection.py --projection "$RUNNER_TEMP/public-catalog"
          python tools/test_sync_public_projection.py
          python tools/validate_portal.py
          python tools/validate_browser_viewer.py
          node tools/test_repositories.cjs
          node tools/test_human_portal.cjs
          node tools/test_home.cjs
          node tools/test_filter_state.cjs
      - name: Commit validated public artifacts to Portal PR branch
        shell: bash
        run: |
          set -euo pipefail
          git add -- catalog assets/generated
          if git diff --cached --quiet; then
            echo "No Portal changes to publish."
            exit 1
          fi
          echo "### Validated Portal sync diff" >> "$GITHUB_STEP_SUMMARY"
          git diff --cached --stat | tee -a "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(portal): sync validated public icons and catalog from MRC 572889177ffd"
          git push origin HEAD:refs/heads/sync/verified-website-icons-20261110

name: Harvest Trend Candidates

on:
  schedule:
    # 08:35 JST. ChatGPT Trend task starts at 09:00 JST.
    - cron: '35 23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/trend-sources.json'
      - 'tools/harvest_trend_sources.py'
      - 'tools/refine_trend_candidates.py'
      - 'tools/validate_trend_candidates.py'
      - '.github/workflows/harvest-trend-candidates.yml'

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Compile harvest tools
        run: |
          python3 -m py_compile \
            tools/harvest_trend_sources.py \
            tools/refine_trend_candidates.py \
            tools/validate_trend_candidates.py

      - name: Harvest source-native candidates
        run: python3 tools/harvest_trend_sources.py

      - name: Refine candidates and add note API hits
        run: python3 tools/refine_trend_candidates.py

      - name: Validate candidate dataset
        run: python3 tools/validate_trend_candidates.py

      - name: Publish transient candidate cache branch
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- data/trend-candidates.json; then
            echo 'Candidate dataset is unchanged.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Candidate data is transient discovery cache, not Portal source-of-truth.
          # Keep main untouched and replace one dedicated cache branch each run.
          git switch -c trend-candidates/latest
          git add data/trend-candidates.json

          mapfile -t staged < <(git diff --cached --name-only)
          if [[ "${#staged[@]}" -ne 1 || "${staged[0]}" != 'data/trend-candidates.json' ]]; then
            echo 'Refusing candidate publish: only data/trend-candidates.json may change.'
            printf 'Staged file: %s\n' "${staged[@]}"
            exit 1
          fi

          git commit -m 'chore: refresh transient Trend candidate cache'
          git push --force origin HEAD:refs/heads/trend-candidates/latest
          echo 'Published candidate cache to trend-candidates/latest.'

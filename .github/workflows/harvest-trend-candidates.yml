name: Harvest Trend Candidates

on:
  schedule:
    # 08:35 JST. ChatGPT Trend task starts at 09:00 JST.
    - cron: '35 23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/trend-sources.json'
      - 'tools/harvest_trend_sources.py'
      - 'tools/validate_trend_candidates.py'
      - '.github/workflows/harvest-trend-candidates.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Compile harvest tools
        run: |
          python3 -m py_compile tools/harvest_trend_sources.py tools/validate_trend_candidates.py

      - name: Harvest source-native candidates
        run: python3 tools/harvest_trend_sources.py

      - name: Validate candidate dataset
        run: python3 tools/validate_trend_candidates.py

      - name: Create audited candidate refresh PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- data/trend-candidates.json; then
            echo 'Candidate dataset is unchanged.'
            exit 0
          fi

          branch="trend-candidates/$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "${branch}"
          git add data/trend-candidates.json

          mapfile -t staged < <(git diff --cached --name-only)
          if [[ "${#staged[@]}" -ne 1 || "${staged[0]}" != 'data/trend-candidates.json' ]]; then
            echo 'Refusing candidate update: only data/trend-candidates.json may change.'
            printf 'Staged file: %s\n' "${staged[@]}"
            exit 1
          fi

          git commit -m 'chore: refresh Trend candidate harvest'
          head_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:${branch}"

          pr_url="$(gh pr create \
            --repo "${REPO}" \
            --base main \
            --head "${branch}" \
            --title 'chore: refresh Trend candidate harvest' \
            --body 'Automated source-native candidate refresh. Only `data/trend-candidates.json` is changed. Candidate data is transient discovery metadata and is not promoted to permanent Knowledge.')"

          pr_number="$(gh pr view "${pr_url}" --repo "${REPO}" --json number --jq '.number')"
          pr_head_sha="$(gh pr view "${pr_url}" --repo "${REPO}" --json headRefOid --jq '.headRefOid')"

          if [[ "${pr_head_sha}" != "${head_sha}" ]]; then
            echo 'Refusing merge: PR head changed after harvest validation.'
            exit 1
          fi

          mapfile -t files < <(gh api --paginate "repos/${REPO}/pulls/${pr_number}/files" --jq '.[].filename')
          if [[ "${#files[@]}" -ne 1 || "${files[0]}" != 'data/trend-candidates.json' ]]; then
            echo 'Refusing merge: candidate PR scope changed.'
            printf 'Changed file: %s\n' "${files[@]}"
            exit 1
          fi

          merge_json="$(gh api \
            --method PUT \
            "repos/${REPO}/pulls/${pr_number}/merge" \
            -f merge_method=merge \
            -f sha="${head_sha}" \
            -f commit_title="chore: refresh Trend candidate harvest (#${pr_number})")"

          if [[ "$(jq -r '.merged // false' <<<"${merge_json}")" != 'true' ]]; then
            echo 'Candidate PR merge failed.'
            jq . <<<"${merge_json}"
            exit 1
          fi

          gh api --method DELETE "repos/${REPO}/git/refs/heads/${branch//\//%2F}" || true
          echo "Candidate harvest merged as PR #${pr_number}."

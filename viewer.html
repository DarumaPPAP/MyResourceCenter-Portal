<!doctype html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Viewer | MyResourceCenter</title>
  <meta name="description" content="MyResourceCenterのOriginalを資料サイズに応じてDrive PreviewまたはAdobe PDF Embed APIで表示します。">
  <link rel="stylesheet" href="assets/site.css">
  <link rel="stylesheet" href="assets/documents.css">
  <script defer src="assets/portal.js"></script>
  <script defer src="assets/viewer-config.js"></script>
  <script defer src="assets/viewer.js"></script>
</head>
<body class="viewer-body">
  <main class="viewer-page">
    <header class="viewer-header">
      <div class="viewer-heading">
        <a class="viewer-back" href="documents.html" aria-label="Documentsへ戻る">←</a>
        <div class="viewer-title-wrap">
          <h1 class="viewer-title" id="viewer-title">Original Document</h1>
          <div class="viewer-meta" id="viewer-meta">Adaptive Viewer</div>
        </div>
      </div>
      <div class="viewer-actions">
        <a class="resource-button" id="viewer-drive-link" href="#" target="_blank" rel="noopener noreferrer">Drive Original ↗</a>
        <button class="resource-button primary" id="viewer-fullscreen" type="button">全画面表示</button>
      </div>
    </header>
    <section class="viewer-stage" aria-label="Document preview">
      <iframe class="viewer-frame" id="viewer-frame" title="Google Drive document preview" allow="fullscreen" allowfullscreen></iframe>
      <div class="adobe-view is-hidden" id="adobe-dc-view" aria-label="Adobe PDF document preview"></div>
      <div class="viewer-loading" id="viewer-loading">
        <div class="viewer-loading-card">
          <div class="viewer-spinner" aria-hidden="true"></div>
          <strong id="viewer-loading-title">Originalをブラウザで読み込み中</strong>
          <p id="viewer-loading-message">資料サイズと形式から最適なViewerを選択しています。</p>
          <div class="viewer-error" id="viewer-error"></div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>

<!doctype html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Documents | MyResourceCenter</title>
  <meta name="description" content="Google Drive OriginalをPortal内ブラウザViewerで閲覧します。">
  <link rel="stylesheet" href="assets/site.css">
  <link rel="stylesheet" href="assets/documents.css">
  <script defer src="assets/portal.js"></script>
  <script defer src="assets/catalog.js"></script>
</head>
<body class="browse-page">
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand-lockup"><div class="brand-mark">M</div><div class="brand-name">MyResourceCenter</div></div>
    <nav class="side-nav"><a href="index.html"><span class="icon">⌂</span>ホーム</a><a class="active" href="documents.html"><span class="icon">▤</span>ドキュメント</a><a href="websites.html"><span class="icon">◎</span>Webサイト</a></nav>
    <div class="sidebar-note">技術資料をタイトル・分野・タグから探し、ブラウザで読み進めます。</div>
  </aside>
  <main class="main">
    <header class="topbar"><div class="breadcrumb">Documents / Library</div><div class="top-actions"><button class="icon-button theme-toggle" type="button">Dark</button></div></header>
    <nav class="mobile-nav"><a href="index.html">ホーム</a><a href="documents.html">Documents</a><a href="websites.html">Websites</a></nav>
    <div class="content">
      <section class="hero">
        <div class="hero-copy">
          <div class="eyebrow">Document Library</div>
          <h1>登録資料をブラウザで見る</h1>
          <p>講演スライドや論文を検索。PDF・PPTXをブラウザで閲覧できます。</p>
        </div>
        </section>



      <div class="toolbar">
        <input aria-label="キーワード検索" id="q" type="search" placeholder="資料名を検索">
        <select aria-label="カテゴリ" id="category"><option value="">カテゴリすべて</option></select>
        <select aria-label="ファイル形式" id="format"><option value="">形式すべて</option><option value="PDF">PDF</option><option value="PPTX">PPTX</option></select>
        <select aria-label="タグ" id="tag"><option value="">タグすべて</option></select><button id="clear" type="button">条件をリセット</button>
      </div>
      <div class="result-meta"><span id="count" role="status" aria-live="polite">読み込み中…</span><span>タイトルを選ぶとプレビューを開きます</span></div>
      <div class="document-library" id="list"></div>
    </div>
    <footer class="footer">MyResourceCenter Human Portal · Document Library</footer>
  </main>
</div>
<script defer src="assets/human-portal.js"></script>
</body>
</html>
